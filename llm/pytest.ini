[pytest]
# 测试运行在容器内，PYTHONPATH=/app/src 已由镜像设置。
testpaths = tests
python_files = test_*.py
asyncio_mode = auto

# 标记说明：
#   scenario  — 端到端对话场景测试（真实 LLM，慢）
#   smoke     — 核心冒烟用例，必须稳定通过
markers =
    scenario: 端到端对话场景测试（真实 LLM）
    smoke: 核心冒烟用例
    config: 配置校验测试（加载 YAML，不调 LLM，快）
    bench: 量化测试（打真实 LLM、慢，非回归断言，手动跑取数据）

# 日志：log_cli 级别设 WARNING —— 屏蔽 httpx/structlog 的 INFO 噪音，
# 让 SCENARIO_TRACE 的对话过程打印（走 print）清爽可读；
# 重试警告、错误等 WARNING+ 仍会显示。需要全量 INFO 日志排查时临时调回。
log_cli = true
log_cli_level = WARNING