store:
  type: qdrant
  url: http://qdrant:6333
  timeout: 30
  collections:
    chunks: knowledge_chunks
  import_path: store.qdrant.QdrantStore
dense:
  name: bge_base
  model_name: bge-base-zh-v1.5
  import_path: dense.huggingface.HuggingFaceDense
sparse:
  type: bm25
  tokenizer: jieba
  import_path: sparse.bm25.BM25Sparse
search:
