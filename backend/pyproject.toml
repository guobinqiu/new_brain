[project]
name = "qdrant-knowledge-backend"
version = "0.1.0"
description = "Qdrant knowledge search backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "python-multipart>=0.0.12",
    "sentence-transformers>=3.0.0",
    "pypdf>=5.0.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.18.0",
    "langchain-qdrant>=1.1.0",
    "langchain-chroma>=1.0.0",
    "langchain-milvus>=0.2.0",
    "chromadb>=1.0.0",
    "langchain-huggingface>=0.1.0",
    "docx2txt>=0.8",
    "unstructured>=0.24.1",
    "markdown>=3.10.2",
    "pymupdf>=1.28.0",
    "paddleocr>=3.0.0",
    "pytesseract>=0.3.13",
    "rapidocr>=3.9.2",
    "langchain>=1.3.14",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "pillow>=12.3.0",
    "modelscope>=1.39.0",
    "FlagEmbedding>=1.3.5",
    "opencv-python-headless>=4.10.0.84,<5.0.0",
    "dependency-injector>=4.48.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.13.0",
    "onnxruntime>=1.28.0",
    "paddlepaddle>=3.0.0",
]
gpu = [
    "torch>=2.13.0",
    "onnxruntime-gpu>=1.28.0",
    "paddlepaddle>=3.0.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]
paddlepaddle = [
    { index = "paddle-cpu", extra = "cpu" },
    { index = "paddle-cpu", extra = "gpu" },
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-docx>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: tests touching local stores or model-backed components",
    "e2e: HTTP/API workflow tests",
    "smoke: minimal availability tests",
    "benchmark: long-running search benchmark tests",
]
