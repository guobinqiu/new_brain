embedded:
  enable: false
  dense:
    # bge_base 和 bge_m3 不能同时开启
    bge_base:
      enable: false
      model_name: BAAI/bge-base-zh-v1.5
      # batch_size 小:
      # 单次显存/内存占用低
      # 总调用轮次更多
      # 吞吐更低
      # API 返回仍然完整

      # batch_size 大:
      # 吞吐更好
      # 显存/内存占用更高
      # 太大可能 OOM
      batch_size: 4

      # release_memory 可选值
      # per_batch 每个 batch 后释放
      # after_call 每次接口调用后释放
      # never 不主动释放
      release_memory: never
    bge_m3:
      enable: true
      model_name: BAAI/bge-m3
      batch_size: 4
      release_memory: never
  sparse:
    bge_m3:
      enable: true
      model_name: BAAI/bge-m3
      batch_size: 4
      release_memory: after_call
  rerank:
    bge_base:
      enable: false
      model_name: BAAI/bge-reranker-base
    bge_m3:
      enable: false
      model_name: BAAI/bge-reranker-v2-m3

# 价格
# https://siliconflow.cn/pricing
# 限流 升级Pro
# https://docs.siliconflow.com/cn/userguide/rate-limits/rate-limit-and-upgradation
siliconflow-cn:
  enable: true
  base_url: https://api.siliconflow.cn/v1
  retry:
    max_attempts: 3
    interval_seconds: 0.5
  dense:
    bge_m3:
      enable: true
      #model_name: BAAI/bge-m3 # RPM:2000-10000 TPM:500000-10000000
      model_name: Qwen/Qwen3-Embedding-0.6B # 0.07 元/百万 tokens RPM:2000 TPM:1000000
      # 维度高表达能力更强，召回可能更准，但不是线性提升
      # - 1024 是它的最高常用输出维度，信息保留最多
      # - 768 通常会更省存储、更快一点，精度可能略低
      # - 512/256 更省，但语义细节会损失更多
      dimensions: 1024 # 仅用于支持自定义维度的模型
      timeout: 30
  rerank:
    bge_m3:
      enable: true
      # model_name: BAAI/bge-reranker-v2-m3 # RPM:2000 TPM:500000
      model_name: Qwen/Qwen3-Reranker-0.6B # 0.07 元/百万 tokens RPM:2000 TPM:1000000
      timeout: 30

# 国际版 SiliconFlow，支持中国大陆以外地区访问
# 限流
# https://siliconflow-4a6a0801.mintlify.app/en/userguide/rate-limits/rate-limit-and-upgradation
siliconflow-intl:
  enable: false
  base_url: https://api.siliconflow.com/v1
  retry:
    max_attempts: 3
    interval_seconds: 0.5
  dense:
    bge_m3:
      enable: true
      # https://www.siliconflow.com/models/embedding
      model_name: Qwen/Qwen3-Embedding-0.6B # 0.01 美元/百万 Tokens  RPM:2000-10000 TPM:500000-10000000
      dimensions: 1024
      timeout: 30
  rerank:
    bge_m3:
      enable: true
      # https://www.siliconflow.com/models/reranker
      model_name: Qwen/Qwen3-Reranker-0.6B # 0.01 美元/百万 Tokens RPM:2000 TPM:500000
      timeout: 30


# 价格
# https://docs.volcengine.com/docs/82379/1544106?lang=zh
volcengine:
  enable: false
  base_url: https://ark.cn-beijing.volces.com/api/v3
  rerank_base_url: https://api-knowledgebase.mlp.cn-beijing.volces.com
  region: cn-beijing
  retry:
    max_attempts: 3
    interval_seconds: 0.5
  dense:
    doubao_embedding_vision:
      enable: true
      model_name: doubao-embedding-vision-251215 # 0.0007 元/千token = 0.7 元/百万 tokens
      dimensions: 1024 # 1024 或 2048，文档和查询使用相同维度
      timeout: 30
  sparse:
    doubao_embedding_vision:
      enable: false
      model_name: doubao-embedding-vision-251215
      timeout: 30
  rerank: # 统一 0.0005 元/千token = 0.5 元/百万 tokens
    doubao_seed_rerank:
      enable: true
      # 字节自研多模态重排模型，当前服务只接文本重排
      model_name: doubao-seed-rerank
      timeout: 30
    base_multilingual_rerank:
      enable: false
      # 速度快、长文本，支持 70+ 种语言
      model_name: base-multilingual-rerank
      timeout: 30
    m3_v2_rerank:
      enable: false
      # 常规文本，支持 100+ 种语言
      model_name: m3-v2-rerank
      timeout: 30

tei:
  enable: false
