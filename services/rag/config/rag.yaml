logging:
  level: INFO
  loki_url: http://loki:3100
  # 单个日志文件最大 10MiB
  max_bytes: 10485760
  # 最多保留 5 个轮转日志文件
  backup_count: 5
  search_trace: true

storage:
  endpoint_url: https://opsonic-brittny-unantagonized.ngrok-free.dev
  bucket: rag
  # 获取预签名下载地址的请求超时，单位秒
  presign_timeout: 60

api:
  rate_limit: 120/minute
  rate_limit_index: 10/minute
  # 同步索引执行预算，阶段间检查截止时间，应小于 Nginx 固定的 900 秒
  index_timeout: 600
  batch_index:
    # 批量索引壳反调单文件索引接口的服务内地址
    base_url: http://rag:6000
    # 单次批量最多提交文件数
    max_files: 10
    # 单次批量最多并发文件数
    max_concurrency: 5
auth:
  # 仅在关系数据库关闭时使用
  apps:
    - app_id: imsdom
      api_key: bk_sOximdu9G4KyfSXklZvp4SPPe2iZLSu3Gh6AJLQ2a_E
  admin:
    username: admin
db:
  # 关系数据库可启用零个或一个
  # 全部关闭时从 auth.apps 读取应用绑定，索引只写向量库
  postgres:
    enable: true
    url: postgresql://rag:rag@postgres:5432/rag
    pool_size: 5
    retry:
      max_attempts: 3
      interval_seconds: 0.5
search:
  # mode=hybrid 时，如果当前 inference 没有启用 sparse，RAG 会自动降级为 dense
  # mode=sparse 时，如果当前 inference 没有启用 sparse，请求会返回 400
  mode: hybrid
  top_k: 5
  # rerank_fetch_k 只在 rerank=true 时使用
  # rerank=false 时直接检索 top_k
  # rerank=true 时先检索 rerank_fetch_k 再重排到 top_k
  rerank_fetch_k: 20
  rerank: true
  # hybrid 使用标准 RRF 融合 dense 和 sparse 排名
  # rrf_k 只在 mode=hybrid 且 sparse 可用时使用
  # mode=dense、mode=sparse 或 hybrid 回退 dense 时不会参与计算
  hybrid:
    rrf_k: 60
chunking:
  text:
    # 正文按段落独立分片，单段超过此字符数才继续拆分
    chunk_size: 500
    # 仅用于同一超长段落内的分片重叠，不跨段落
    chunk_overlap: 80
parser:
  base_url: http://parser:7000
  timeout: 300
inference:
  base_url: http://inference:7001
  embedding:
    timeout: 30
  rerank:
    timeout: 30
vector_db:
  # 向量库必须且只能启用一个
  qdrant:
    enable: false
    base_url: http://qdrant:6333
    # 搜索、列表、读取向量
    query_timeout: 10
    # 写入 chunk、删除 chunk、flush
    write_timeout: 60
    # 创建 collection、创建索引、load
    init_timeout: 120
    # 删除 collection
    drop_timeout: 180
    retry:
      max_attempts: 3
      interval_seconds: 0.5
    quantization:
      enable: false
      type: int8
      quantile: 0.99
      always_ram: true
  milvus:
    enable: true
    base_url: http://milvus:19530
    query_timeout: 10
    write_timeout: 60
    init_timeout: 120
    drop_timeout: 180
    retry:
      max_attempts: 3
      interval_seconds: 0.5

  # https://cloud.qdrant.io/accounts/437181ee-d8ff-401b-99d5-29fad5a7cf0b/clusters/ba2d743e-5dad-4ee8-b181-e3a05e4df4ae/inference/df747cd6-983e-4323-a713-2f5bf3cfbf93    
  qdrant_cloud:
    enable: false
    base_url: https://ba2d743e-5dad-4ee8-b181-e3a05e4df4ae.sa-east-1-0.aws.cloud.qdrant.io
    query_timeout: 10
    write_timeout: 60
    init_timeout: 120
    drop_timeout: 180
    retry:
      max_attempts: 3
      interval_seconds: 0.5
    quantization:
      enable: false
      type: int8
      quantile: 0.99
      always_ram: true

  # https://docs.zilliz.com.cn/docs/on-demand-compute-cost    
  milvus_cloud:
    enable: false
    base_url: https://in03-748dd5b2366e2b6.serverless.ali-cn-hangzhou.cloud.zilliz.com.cn
    query_timeout: 10
    write_timeout: 60
    init_timeout: 120
    drop_timeout: 180
    retry:
      max_attempts: 3
      interval_seconds: 0.5
