[project]
name = "brain-rag"
version = "0.1.0"
description = "Brain RAG API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.6",
    "langchain-core>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "minio>=7.2.0",
    "psycopg[binary,pool]>=3.2.0",
    "pymilvus>=3.0.0",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.19.0",
    "pyyaml>=6.0.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]
