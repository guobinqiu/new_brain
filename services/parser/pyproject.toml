[project]
name = "brain-parser"
version = "0.1.0"
description = "Brain document parser service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "docling>=2.58.0",
    "markdown-it-py>=4.2.0",
    "openpyxl>=3.1.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]
