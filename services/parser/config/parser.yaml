parser:
  download_timeout: 60

  mineru:
    enable: true
    tier: basic # flash, basic, standard, advanced
    parse_method: auto # auto, ocr, txt
    image_analysis: false
  
  mineru_cloud:
    enable: false
    base_url: https://mineru.net
    timeout: 300
    model_version: vlm # 可选值: pipeline|vlm|MinerU-HTML
    enable_formula: true
    enable_table: true
    language: ch
    retry:
      max_attempts: 3
      interval_seconds: 0.5

  # 基于 prompt 偶尔会返回非法json导致解析失败，需有重试机制
  volcengine:
    enable: false
    base_url: https://ark.cn-beijing.volces.com/api/v3
    timeout: 300
    retry:
      max_attempts: 3
      interval_seconds: 0.5
    model: doubao-seed-2-0-mini-260428  # 17.6 元/百万 tokens
    thinking: false # true 开启深度思考，false 关闭
    service_tier: default # fast 优先低延迟，default 常规，auto 优先 TPM 保障包，实际档位以响应为准
    stream: true # true 流式接收并记录首段正文和后续输出耗时，false 非流式接收
    prompt: |
      按阅读顺序提取整个 PDF，保留原文，不总结、不编造，忽略图片及其说明
      返回 {"blocks": [...]}，块结构如下：
      {"type":"text","kind":"paragraph","text":"正文","page":1}
      {"type":"table","caption":"原文表格标题","rows":[["列标题"],["单元格"]],"page":1}
      {"type":"formula","text":"LaTeX 公式","format":"latex","page":1}
      文本按原始结构逐块输出，kind 为 heading 标题、paragraph 段落、list_item 列表项、code 代码、text 无法分类文本
      保持段落和代码完整，保留列表标记、缩进及换行，标题与正文分开，不跨页或跨表格、公式合并
      每张逻辑表格完整输出为一块，跨页续表合并，重复表头只保留一次，不同表格不合并
      rows 第一行为原表列标题，其余为数据；所有单元格使用字符串，包括空单元格，不把续页数据当表头
      表格标题原样放入 caption，保留编号，不重复输出到文本块；没有明确标题则省略，不编造
      表格内容不重复输出为文本，公式使用 LaTeX
      page 从 1 开始，跨页表格使用起始页码
      只输出合法 JSON，正确转义引号、换行和反斜杠，不加代码围栏、额外字段或其他说明
