[project]
name = "brain-ops"
version = "0.1.0"
description = "Brain ops management service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests",
]
