database:
  type: postgres
  url: postgresql://rag:rag@localhost:5432/rag
  pool_size: 5
  import_path: database.postgres.PostgresDatabase
logging:
  level: INFO
  max_bytes: 10485760
  backup_count: 5
  search_trace: true
api:
  rate_limit: 120/minute
  rate_limit_index: 10/minute
auth:
  admin:
    username: admin
    password: admin123
store:
  type: milvus
  uri: http://localhost:19530
  timeout: 30
  import_path: store.milvus.MilvusStore
dense:
  name: bge_base
  model_name: bge-base-zh-v1.5
  import_path: dense.huggingface.HuggingFaceDense
sparse:
  type: milvus_bm25
  tokenizer: jieba
  import_path: sparse.milvus_bm25.MilvusBM25Sparse
search:
  default_mode: hybrid
  top_k: 5
  fetch_k: 20
  dense_weight: 0.5
  sparse_weight: 0.5
  rrf_k: 60
embedding:
  dense_batch_size: 8
  sparse_batch_size: 4
  release_memory: never
parser:
  mineru:
    enable: false
    text:
      chunk_size: 500
      chunk_overlap: 80
    table:
      header_backward_chars: 160
      footer_forward_chars: 160
  unstructured:
    enable: true
    strategy: fast
    infer_table_structure: false
    languages:
      - chi_sim
      - eng
    text:
      chunk_size: 500
      chunk_overlap: 80
    table:
      header_backward_chars: 160
      footer_forward_chars: 160
rerank:
  bge_base:
    enable: true
    model_name: bge-reranker-base
    import_path: rerank.cross_encoder.CrossEncoderRerank
  bge_large:
    enable: false
    model_name: bge-reranker-large
    import_path: rerank.cross_encoder.CrossEncoderRerank
  bge_m3:
    enable: false
    model_name: bge-reranker-v2-m3
    import_path: rerank.cross_encoder.CrossEncoderRerank
ocr:
  rapid:
    enable: false
    model_name: rapidocr
    import_path: ocr.rapid.RapidOCR
  paddle:
    enable: true
    model_name: paddleocr
    import_path: ocr.paddle.PaddleOCR
  tesseract:
    enable: false
    model_name: tesseract
    import_path: ocr.tesseract.TesseractOCR
