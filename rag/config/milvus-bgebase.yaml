database:
  type: postgres
  pool_size: 5
  import_path: database.postgres.PostgresDatabase
logging:
  level: INFO
  max_bytes: 10485760
  backup_count: 5
  search_trace: true
api:
  rate_limit: 120/minute
  rate_limit_index: 10/minute
auth:
  admin:
    username: admin
    password: admin123
store:
  qdrant:
    enable: false
    type: qdrant
    timeout: 30
    import_path: store.qdrant.QdrantStore
  chroma:
    enable: false
    type: chroma
    persist_dir: chroma_data
    import_path: store.chroma.ChromaStore
  milvus:
    enable: true
    type: milvus
    timeout: 30
    import_path: store.milvus.MilvusStore
  milvus_lite:
    enable: false
    type: milvus_lite
    uri: milvus_data/lite/cpu.db
    timeout: 30
    import_path: store.milvus.MilvusStore
dense:
  name: bge_base
  model_name: bge-base-zh-v1.5
  import_path: dense.huggingface.HuggingFaceDense
sparse:
  simple_bm25:
    enable: false
    tokenizer: jieba
    import_path: sparse.simple_bm25.SimpleBM25Sparse
  bge_m3:
    enable: false
    model_name: bge-m3
    import_path: sparse.qdrant_bge_m3.QdrantBGEM3Sparse
  opensearch_bm25:
    enable: false
    timeout: 10
    username: admin
    password: Admin@123
    import_path: sparse.opensearch_bm25.OpenSearchBM25Sparse
search:
  default_mode: hybrid
  top_k: 5
  fetch_k: 20
  dense_weight: 0.7
  sparse_weight: 0.3
  rrf_k: 60
embedding:
  dense_batch_size: 8
  sparse_batch_size: 4
  release_memory: never
  parallel: true
parser:
  mineru:
    enable: false
    text:
      chunk_size: 500
      chunk_overlap: 80
    table:
      header_backward_chars: 160
      footer_forward_chars: 160
  unstructured:
    enable: true
    strategy: fast
    infer_table_structure: false
    languages:
      - chi_sim
      - eng
    text:
      chunk_size: 500
      chunk_overlap: 80
    table:
      header_backward_chars: 160
      footer_forward_chars: 160
rerank:
  bge_base:
    enable: false
    model_name: bge-reranker-base
    import_path: rerank.cross_encoder.CrossEncoderRerank
  bge_large:
    enable: false
    model_name: bge-reranker-large
    import_path: rerank.cross_encoder.CrossEncoderRerank
  bge_m3:
    enable: false
    model_name: bge-reranker-v2-m3
    import_path: rerank.cross_encoder.CrossEncoderRerank
ocr:
  rapid:
    enable: false
    model_name: rapidocr
    import_path: ocr.rapid.RapidOCR
  paddle:
    enable: false
    model_name: paddleocr
    import_path: ocr.paddle.PaddleOCR
  tesseract:
    enable: false
    model_name: tesseract
    import_path: ocr.tesseract.TesseractOCR
