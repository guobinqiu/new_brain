database:
  type: postgres
  url: postgresql://rag:rag@localhost:5432/rag
  pool_size: 5
  import_path: database.postgres.PostgresDatabase
logging:
  level: INFO
  max_bytes: 10485760
  backup_count: 5
  search_trace: true
api:
  rate_limit: 120/minute
  rate_limit_index: 10/minute
auth:
  admin:
    username: admin
    password: admin123
store:
  type: milvus_lite
  uri: milvus_data/lite/milvus-lite-bge-m3.db
  timeout: 30
  import_path: store.milvus.MilvusStore
dense:
  name: bge_m3
  model_name: bge-m3
  import_path: dense.huggingface.HuggingFaceDense
sparse:
  type: bge_m3
  model_name: bge-m3
  import_path: sparse.milvus_bge_m3.MilvusBGEM3Sparse
search:
  default_mode: hybrid
  top_k: 5
  fetch_k: 20
  dense_weight: 0.5
  sparse_weight: 0.5
  rrf_k: 60
embedding:
  dense_batch_size: 4
  sparse_batch_size: 4
  release_memory: per_batch
parser:
  text:
    chunk_size: 500
    chunk_overlap: 80
  table:
    header_backward_chars: 160
    footer_forward_chars: 160
rerank:
  bge_base:
    enable: true
    model_name: bge-reranker-base
    import_path: rerank.cross_encoder.CrossEncoderRerank
  bge_large:
    enable: false
    model_name: bge-reranker-large
    import_path: rerank.cross_encoder.CrossEncoderRerank
  bge_m3:
    enable: false
    model_name: bge-reranker-v2-m3
    import_path: rerank.cross_encoder.CrossEncoderRerank
ocr:
  rapid:
    enable: false
    model_name: rapidocr
    import_path: ocr.rapid.RapidOCR
  paddle:
    enable: true
    model_name: paddleocr
    import_path: ocr.paddle.PaddleOCR
  tesseract:
    enable: false
    model_name: tesseract
    import_path: ocr.tesseract.TesseractOCR
