x-json-logging: &json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    labels:
      logging: loki
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ../../pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: rag-qdrant
    labels:
      logging: loki
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../../qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: rag-minio
    labels:
      logging: loki
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../../minio_data:/data
    restart: unless-stopped

  backend:
    image: rag-backend:cpu
    build:
      context: ../..
      dockerfile: deploy/cpu/Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        UV_DEFAULT_INDEX_CN: ${UV_DEFAULT_INDEX_CN:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: rag-backend
    labels:
      logging: loki
    ports:
      - "6000:6000"
    environment:
      TZ: Asia/Shanghai
      CONFIG_FILE: ${CONFIG_FILE:-docker-cpu.yaml}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-rag-search}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-rag}
      RAG_NODE_ID: ${RAG_NODE_ID:-node-1}
      RAG_PEERS: ${RAG_PEERS:-}
    volumes:
      - ../../backend:/app/backend
      - ../../models:/app/models:ro
      - ../../chroma_data:/app/chroma_data
      - ../../milvus_data/lite:/app/milvus_data/lite
      - ../../backend/.uv-cache-docker:/root/.cache/uv
    logging: *json-logging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-bookworm-slim
    container_name: rag-frontend
    labels:
      logging: loki
    working_dir: /app/frontend
    environment:
      TZ: Asia/Shanghai
      VITE_API_TARGET: http://backend:6000
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../../frontend:/app/frontend
      - ../../frontend/.node_modules-docker:/app/frontend/node_modules
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: rag-nginx
    labels:
      logging: loki
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.1
    container_name: rag-loki
    profiles:
      - monitoring
    environment:
      TZ: Asia/Shanghai
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ../../deploy/monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - ../../loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.1
    container_name: rag-promtail
    environment:
      TZ: Asia/Shanghai
      RAG_NODE_ID: ${RAG_NODE_ID:-node-1}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    volumes:
      - ../../deploy/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: rag-etcd
    labels:
      logging: loki
    profiles:
      - milvus
    environment:
      TZ: Asia/Shanghai
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ../../milvus_data/standalone/etcd:/etcd
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.20
    container_name: rag-milvus
    labels:
      logging: loki
    profiles:
      - milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_REGION: us-east-1
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ../../milvus_data/standalone/milvus:/var/lib/milvus
    restart: unless-stopped
