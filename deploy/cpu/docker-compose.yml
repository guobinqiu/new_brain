x-json-logging: &json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: rag-backend:cpu
    build:
      context: ../..
      dockerfile: deploy/cpu/Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        UV_DEFAULT_INDEX_CN: ${UV_DEFAULT_INDEX_CN:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: rag-backend
    labels:
      logging: loki
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6000:6000"
    volumes:
      - ../../backend:/app/backend
      - ../../models:/app/models:ro
      - ../../chroma_data:/app/chroma_data
      - ../../milvus_data/lite:/app/milvus_data/lite
      - ../../backend/.uv-cache-docker:/root/.cache/uv
    logging: *json-logging
    restart: unless-stopped

  frontend:
    image: node:22-bookworm-slim
    container_name: rag-frontend
    labels:
      logging: loki
    working_dir: /app/frontend
    env_file:
      - ../.env
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../../frontend:/app/frontend
      - ../../frontend/.node_modules-docker:/app/frontend/node_modules
    logging: *json-logging
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: rag-nginx
    labels:
      logging: loki
    env_file:
      - ../.env
    ports:
      - "5175:80"
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    logging: *json-logging
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.1
    container_name: rag-promtail
    env_file:
      - ../.env
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    volumes:
      - ../../deploy/monitor/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *json-logging
    restart: unless-stopped
