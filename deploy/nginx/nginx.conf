map $request_uri $log_service_request {
    default 1;
    ~^/(api/internal/(parser|inference)/)?ready(\?|$) 0;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log combined if=$log_service_request;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Trace-Id, traceparent" always;
    add_header Access-Control-Expose-Headers "X-Trace-Id" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location /api/v1/llm/ {
        set $llm_upstream llm:6001;
        proxy_pass http://$llm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location = /health {
        set $rag_upstream rag:6000;
        proxy_pass http://$rag_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
        set $rag_upstream rag:6000;
        proxy_pass http://$rag_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/rag/ {
        set $rag_upstream rag:6000;
        proxy_pass http://$rag_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location /api/rag/ {
        set $rag_upstream rag:6000;
        proxy_pass http://$rag_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location /api/ops/ {
        set $ops_upstream ops:7002;
        proxy_pass http://$ops_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location /api/internal/parser/ {
        set $parser_upstream parser:7000;
        rewrite ^/api/internal/parser/(.*)$ /$1 break;
        proxy_pass http://$parser_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location /api/internal/inference/ {
        set $inference_upstream inference:7001;
        rewrite ^/api/internal/inference/(.*)$ /$1 break;
        proxy_pass http://$inference_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
