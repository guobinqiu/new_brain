x-json-logging: &json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: rag-backend:ecu
    build:
      context: ../..
      dockerfile: deploy/ecu/Dockerfile
      additional_contexts:
        ecu_wheels: ${ECU_WHEELS_DIR:-/home/user/guobin/openavatarchat-taco/ecu_wheels}
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        UV_DEFAULT_INDEX_CN: ${UV_DEFAULT_INDEX_CN:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: rag-backend
    labels:
      logging: loki
    env_file:
      - ../.env
    environment:
      ENRIGIN_VISIBLE_DEVICES: ${ENRIGIN_VISIBLE_DEVICES:-0,1}
      LD_LIBRARY_PATH: /opt/rivs/lib
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6000:6000"
    volumes:
      - ../../backend:/app/backend
      - ../../models:/app/models
      - ../../chroma_data:/app/chroma_data
      - ../../milvus_data/lite:/app/milvus_data/lite
      - ../../backend/.uv-cache-docker:/root/.cache/uv
      - ${RIVS_DIR:-/home/user/guobin/rivs}:/opt/rivs:ro
    logging: *json-logging
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.1
    container_name: rag-promtail
    env_file:
      - ../.env
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    volumes:
      - ../../deploy/monitor/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *json-logging
    restart: unless-stopped
