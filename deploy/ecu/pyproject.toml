[project]
name = "brain-rag-ecu"
version = "0.1.0"
description = "Brain RAG backend for D20 ECU"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "python-multipart>=0.0.12",
    "sentence-transformers>=3.0.0",
    "pypdf>=5.0.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.19.0",
    "pymilvus>=3.0.0",
    "milvus-lite>=3.1.0",
    "chromadb>=1.0.0",
    "langchain-huggingface>=0.1.0",
    "pymupdf>=1.28.0",
    "paddleocr>=3.0.0",
    "paddlex[ocr]>=3.7.2",
    "pytesseract>=0.3.13",
    "rapidocr>=3.9.2",
    "langchain>=1.3.14",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "pillow>=12.3.0",
    "modelscope>=1.39.0",
    "mineru[core]>=3.4.0",
    "unstructured[all-docs]>=0.18.0",
    "FlagEmbedding>=1.3.5",
    "opencv-python-headless>=4.10.0.84,<5.0.0",
    "dependency-injector>=4.48.0",
    "minio>=7.2.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "torch==2.11.0+cpu",
    "torchvision==0.26.0+cpu",
    "onnxruntime>=1.22.0,<1.28.0",
    "paddlepaddle>=3.0.0",
]

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]
paddlepaddle = [
    { index = "paddle-cpu" },
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
