version: "3.8"

x-json-logging: &json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  ops:
    image: ${IMAGE_REGISTRY}/brain-ops:${IMAGE_TAG}
    command: ["/app/.venv/bin/uvicorn", "services.ops.app.main:app", "--host", "0.0.0.0", "--port", "7002", "--reload"]
    labels:
      logging: loki
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      STACK: brain
      CTRL_STACK: brain_ctrl
      APP_PROJECT_ROOT: /app
      HOST_PROJECT_ROOT: ${PROJECT_ROOT}
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7002/ready', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${PROJECT_ROOT}/services
        target: /app/services
      - type: bind
        source: ${PROJECT_ROOT}/deploy
        target: /app/deploy
      - type: bind
        source: ${PROJECT_ROOT}/shared
        target: /app/shared
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: ctrl
      replicas: 1
      restart_policy:
        condition: any

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - ops
    labels:
      logging: loki
    ports:
      - target: 80
        published: 5175
        protocol: tcp
        mode: ingress
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/deploy/nginx/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/webui/dist
        target: /usr/share/nginx/html
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: ctrl
      replicas: 1
      restart_policy:
        condition: any

networks:
  default:
    name: brain-net
    external: true
