version: "3.8"

x-json-logging: &json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  rag:
    image: ${IMAGE_REGISTRY}/brain-rag:${IMAGE_TAG}
    command: ["/app/.venv/bin/uvicorn", "services.rag.app.main:app", "--host", "0.0.0.0", "--port", "6000"]
    labels:
      logging: loki
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/services
        target: /app/services
      - type: bind
        source: ${PROJECT_ROOT}/shared
        target: /app/shared
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/models
        target: /app/models
    logging: *json-logging
    deploy:
      labels:
        group: app
      replicas: 1
      restart_policy:
        condition: any

  parser:
    image: ${IMAGE_REGISTRY}/brain-parser:${IMAGE_TAG}
    command: ["/app/.venv/bin/uvicorn", "services.parser.app.main:app", "--host", "0.0.0.0", "--port", "7000"]
    labels:
      logging: loki
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/ready', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 300s
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/services
        target: /app/services
      - type: bind
        source: ${PROJECT_ROOT}/shared
        target: /app/shared
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/models
        target: /app/models
      - type: bind
        source: ${PROJECT_ROOT}/scripts
        target: /app/scripts
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: app
      replicas: 1
      restart_policy:
        condition: any

  inference:
    image: ${IMAGE_REGISTRY}/brain-inference:${IMAGE_TAG}
    command: ["/app/.venv/bin/uvicorn", "services.inference.app.main:app", "--host", "0.0.0.0", "--port", "7001"]
    labels:
      logging: loki
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7001/ready', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/services
        target: /app/services
      - type: bind
        source: ${PROJECT_ROOT}/shared
        target: /app/shared
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/models
        target: /app/models
    logging: *json-logging
    deploy:
      labels:
        group: app
      replicas: 1
      restart_policy:
        condition: any

  llm:
    image: ${IMAGE_REGISTRY}/brain-llm:${IMAGE_TAG}
    command: ["/app/.venv/bin/uvicorn", "services.llm.src.main:app", "--host", "0.0.0.0", "--port", "6001"]
    labels:
      logging: loki
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/services/llm/src
        target: /app/services/llm/src
      - type: bind
        source: ${PROJECT_ROOT}/services/llm/tests
        target: /app/services/llm/tests
      - type: bind
        source: ${PROJECT_ROOT}/services
        target: /app/services
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/shared
        target: /app/shared
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: app
      replicas: 1
      restart_policy:
        condition: any

networks:
  default:
    name: brain-net
    external: true
