version: "3.8"

x-json-logging: &json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    labels:
      logging: loki
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/pg_data
        target: /var/lib/postgresql/data
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  qdrant:
    image: qdrant/qdrant:v1.19.0
    labels:
      logging: loki
    ports:
      - target: 6333
        published: 6333
        protocol: tcp
        mode: host
      - target: 6334
        published: 6334
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/qdrant_data
        target: /qdrant/storage
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    labels:
      logging: loki
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/minio_data
        target: /data
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  loki:
    image: grafana/loki:3.4.1
    command: -config.file=/etc/loki/config.yml
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/deploy/monitor/loki-config.yml
        target: /etc/loki/config.yml
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/loki_data
        target: /loki
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  promtail:
    image: grafana/promtail:3.4.1
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/deploy/monitor/promtail-config.yml
        target: /etc/promtail/config.yml
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 1
      restart_policy:
        condition: any

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    labels:
      logging: loki
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    ports:
      - target: 2379
        published: 2379
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/milvus_data/standalone/etcd
        target: /etcd
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  milvus:
    image: milvusdb/milvus:v3.0.0
    labels:
      logging: loki
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - target: 19530
        published: 19530
        protocol: tcp
        mode: host
      - target: 9091
        published: 9091
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/milvus_data/standalone/milvus
        target: /var/lib/milvus
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  rag:
    image: ${RAG_IMAGE}
    command: ["/app/.venv/bin/uvicorn", "services.rag.app.main:app", "--host", "0.0.0.0", "--port", "6000", "--reload"]
    labels:
      logging: loki
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/services
        target: /app/services
      - type: bind
        source: ${PROJECT_ROOT}/shared
        target: /app/shared
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/models
        target: /app/models
    logging: *json-logging
    deploy:
      labels:
        group: app
      replicas: 1
      restart_policy:
        condition: any

  parser:
    image: ${PARSER_IMAGE}
    command: ["/app/.venv/bin/uvicorn", "services.parser.app.main:app", "--host", "0.0.0.0", "--port", "7000", "--reload"]
    labels:
      logging: loki
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/ready', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/services
        target: /app/services
      - type: bind
        source: ${PROJECT_ROOT}/shared
        target: /app/shared
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/models
        target: /app/models
      - type: bind
        source: ${PROJECT_ROOT}/scripts
        target: /app/scripts
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: app
      replicas: 1
      restart_policy:
        condition: any

  inference:
    image: ${INFERENCE_IMAGE}
    command: ["/app/.venv/bin/uvicorn", "services.inference.app.main:app", "--host", "0.0.0.0", "--port", "7001", "--reload"]
    labels:
      logging: loki
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7001/ready', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/services
        target: /app/services
      - type: bind
        source: ${PROJECT_ROOT}/shared
        target: /app/shared
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/models
        target: /app/models
    logging: *json-logging
    deploy:
      labels:
        group: app
      replicas: 1
      restart_policy:
        condition: any

  llm:
    image: ${LLM_IMAGE}
    command: ["/app/.venv/bin/uvicorn", "services.llm.src.main:app", "--host", "0.0.0.0", "--port", "6001", "--reload"]
    labels:
      logging: loki
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/services/llm/src
        target: /app/services/llm/src
      - type: bind
        source: ${PROJECT_ROOT}/services/llm/tests
        target: /app/services/llm/tests
      - type: bind
        source: ${PROJECT_ROOT}/services
        target: /app/services
        read_only: true
      - type: bind
        source: ${PROJECT_ROOT}/shared
        target: /app/shared
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: app
      replicas: 1
      restart_policy:
        condition: any

  tei_dense:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    command: ["--model-id", "/model"]
    labels:
      logging: loki
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - target: 80
        published: 8081
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/models/BAAI/bge-m3
        target: /model
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: any

  tei_rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    command: ["--model-id", "/model"]
    labels:
      logging: loki
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - target: 80
        published: 8082
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/models/BAAI/bge-reranker-v2-m3
        target: /model
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: any

  vllm_dense:
    image: vllm/vllm-openai:v0.20.2
    command: ["--model", "/model", "--served-model-name", "BAAI/bge-m3", "--runner", "pooling", "--dtype", "auto", "--trust-remote-code", "--max-model-len", "8192", "--gpu-memory-utilization", "0.20"]
    labels:
      logging: loki
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - target: 8000
        published: 8083
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/models/BAAI/bge-m3
        target: /model
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: any

  vllm_rerank:
    image: vllm/vllm-openai:v0.20.2
    command: ["--model", "/model", "--served-model-name", "BAAI/bge-reranker-v2-m3", "--runner", "pooling", "--dtype", "auto", "--trust-remote-code", "--max-model-len", "8192", "--gpu-memory-utilization", "0.20"]
    labels:
      logging: loki
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - target: 8000
        published: 8084
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/models/BAAI/bge-reranker-v2-m3
        target: /model
        read_only: true
    logging: *json-logging
    deploy:
      labels:
        group: infra
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: any

networks:
  default:
    name: brain-net
    external: true
