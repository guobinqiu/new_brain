x-json-logging: &json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    labels:
      logging: loki
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ../../pg_data:/var/lib/postgresql/data
    logging: *json-logging
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: rag-qdrant
    labels:
      logging: loki
    env_file:
      - ../.env
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../../qdrant_data:/qdrant/storage
    logging: *json-logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: rag-minio
    labels:
      logging: loki
    env_file:
      - ../.env
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../../minio_data:/data
    logging: *json-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.1
    container_name: rag-loki
    env_file:
      - ../.env
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ../../deploy/monitor/loki-config.yml:/etc/loki/config.yml:ro
      - ../../loki_data:/loki
    logging: *json-logging
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: rag-etcd
    labels:
      logging: loki
    profiles:
      - milvus
    env_file:
      - ../.env
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ../../milvus_data/standalone/etcd:/etcd
    logging: *json-logging
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.20
    container_name: rag-milvus
    labels:
      logging: loki
    profiles:
      - milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    env_file:
      - ../.env
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ../../milvus_data/standalone/milvus:/var/lib/milvus
    logging: *json-logging
    restart: unless-stopped
